name: Forgejo Actions Windows Latest Runner

on:
  workflow_dispatch:

jobs:
  spin-up-runner:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Get latest runner version
        id: runner-version
        shell: bash
        run: echo "version=$(curl -sL "https://api.github.com/repos/Crown0815/Forgejo-runner-windows-builder/releases/latest" | jq -r ".tag_name")" >> "$GITHUB_OUTPUT"

      - name: Runner binary cache
        if: steps.runner-version.outputs.version != 'null'
        id: runner-binary-cache
        uses: actions/cache@v6
        with:
          path: ~/.forgejo-runner/runner.exe
          key: forgejo-runner-windows-latest-${{ steps.runner-version.outputs.version }}

      - name: Runner binary restore
        if: steps.runner-version.outputs.version == 'null'
        id: runner-binary-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.forgejo-runner/runner.exe
          key: forgejo-runner-windows-latest-
          restore-keys: forgejo-runner-windows-latest-

      - name: Actions cache cache (lol)
        uses: actions/cache@v6
        with:
          path: ~/.forgejo-runner/cache
          key: actions-cache-windows-latest-${{ github.run_id }}
          restore-keys: actions-cache-windows-latest-

      - name: Download runner
        if: steps.runner-binary-cache.outputs.cache-hit != 'true' && steps.runner-binary-restore.outputs.cache-hit != 'true'
        env:
          ARCH: "amd64"
          RUNNER_VERSION: ${{ steps.runner-version.outputs.version }}
        shell: bash
        run: |
          if [ "$RUNNER_VERSION" = "null" ]; then
            RUNNER_VERSION="v12.12.0"
          fi

          mkdir -p ~/.forgejo-runner
          curl -L -o ~/.forgejo-runner/runner.exe \
            https://github.com/Crown0815/Forgejo-runner-windows-builder/releases/download/${RUNNER_VERSION}/forgejo-runner-windows-${ARCH}.exe

      - name: Create runner config
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p ~/.forgejo-runner

          gh api \
            -H "Accept: application/vnd.github.raw" \
            /repos/${{ github.repository }}/contents/.github/gh-windows-latest-config.yml?ref=${{ github.ref }} \
            > ~/.forgejo-runner/config.yml

          sed -i -e "s/SECRETS_RUNNER_UUID/${{ secrets.WINDOWS_LATEST_RUNNER_UUID }}/g" \
            -e "s/SECRETS_RUNNER_TOKEN/${{ secrets.WINDOWS_LATEST_RUNNER_TOKEN }}/g" \
            ~/.forgejo-runner/config.yml

      - name: Run one job
        shell: bash
        run: |
          EXIT_CODE=0
          ~/.forgejo-runner/runner.exe one-job --config ~/.forgejo-runner/config.yml || EXIT_CODE=$?

          if [ $EXIT_CODE -eq 2 ]; then
            echo "no jobs in queue, exiting..."
            exit 0
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo "runner encountered an error (code: $EXIT_CODE), aborting..."
            exit 1
          fi

          echo "finished successfully"
