name: Forgejo Actions Ubuntu Latest Runner

on:
  workflow_dispatch:

jobs:
  spin-up-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get latest runner version
        id: runner-version
        run: echo "version=$(curl -sL "https://data.forgejo.org/api/v1/repos/forgejo/runner/releases/latest" | jq -r ".tag_name")" >> "$GITHUB_OUTPUT"

      - name: Runner binary cache
        if: steps.runner-version.outputs.version != 'null'
        id: runner-binary-cache
        uses: actions/cache@v6
        with:
          path: ~/.forgejo-runner/runner
          key: forgejo-runner-ubuntu-latest-${{ steps.runner-version.outputs.version }}

      - name: Runner binary restore
        if: steps.runner-version.outputs.version == 'null'
        id: runner-binary-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.forgejo-runner/runner
          key: forgejo-runner-ubuntu-latest-
          restore-keys: forgejo-runner-ubuntu-latest-

      - name: Actions cache cache (lol)
        uses: actions/cache@v6
        with:
          path: ~/.forgejo-runner/cache
          key: actions-cache-ubuntu-latest-${{ github.run_id }}
          restore-keys: actions-cache-ubuntu-latest-

      - name: Download runner
        if: steps.runner-binary-cache.outputs.cache-hit != 'true' && steps.runner-binary-restore.outputs.cache-hit != 'true'
        env:
          ARCH: "amd64"
          RUNNER_VERSION: ${{ steps.runner-version.outputs.version }}
        run: |
          if [ "$RUNNER_VERSION" = "null" ]; then
            RUNNER_VERSION="v13.0.0"
          fi

          mkdir -p ~/.forgejo-runner
          curl -L -o ~/.forgejo-runner/runner \
            https://code.forgejo.org/forgejo/runner/releases/download/${RUNNER_VERSION}/forgejo-runner-${RUNNER_VERSION#v}-linux-${ARCH}
          chmod +x ~/.forgejo-runner/runner

      - name: Create runner config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.forgejo-runner

          gh api \
            -H "Accept: application/vnd.github.raw" \
            /repos/${{ github.repository }}/contents/.github/gh-ubuntu-latest-config.yml?ref=${{ github.ref }} \
            > ~/.forgejo-runner/config.yml

          sed -i -e "s/SECRETS_RUNNER_UUID/${{ secrets.UBUNTU_LATEST_RUNNER_UUID }}/g" \
            -e "s/SECRETS_RUNNER_TOKEN/${{ secrets.UBUNTU_LATEST_RUNNER_TOKEN }}/g" \
            ~/.forgejo-runner/config.yml

      - name: Run one job
        run: |
          for attempt in {1..3}; do
            EXIT_CODE=0
            ~/.forgejo-runner/runner one-job --config ~/.forgejo-runner/config.yml || EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then
              echo "finished successfully"
              exit 0
            elif [ $EXIT_CODE -eq 2 ]; then
              echo "no jobs in queue, retrying in 3s..."
              sleep 3
            else
              echo "runner encountered an error (code: $EXIT_CODE), aborting..."
              exit 1
            fi
          done

          echo "no jobs in queue, exiting..."
