name: Test

on:
  push:
  schedule:
  - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  echo-test:
    strategy:
        matrix:
          os: [gh-ubuntu-latest, gh-windows-latest, gh-macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - run: echo "echo test successful!"

  cache-save-test:
    strategy:
        matrix:
          os: [gh-ubuntu-latest, gh-windows-latest, gh-macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Write test text to test.txt
        shell: bash
        run: echo ${{ forgejo.run_id }} > ./test.txt

      - name: Save test.txt cache
        uses: actions/cache/save@v6
        with:
          path: ./test.txt
          key: test-cache-${{ matrix.os }}-${{ forgejo.run_id }}

  cache-restore-test:
    strategy:
        matrix:
          os: [gh-ubuntu-latest, gh-windows-latest, gh-macos-latest]
    runs-on: ${{ matrix.os }}
    needs: cache-save-test

    steps:
      - name: Restore test.txt cache
        uses: actions/cache/restore@v6
        with:
          path: ./test.txt
          key: test-cache-${{ matrix.os }}-${{ forgejo.run_id }}

      - name: Read test.txt test text
        shell: bash
        run: |
          if [ "$(cat ./test.txt)" != "${{ forgejo.run_id }}" ]; then
              echo "cache test failed"
              exit 1
          fi
          echo "cache successfully restored and verified!"
